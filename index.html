    <script>
      // New visitors start in light mode. A theme picked with the toggle is remembered (reloads
      // and later visits) and applied before first paint.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          ['dark', 'red', 'blue', 'green', 'yellow'].indexOf(theme) > -1 ? theme : 'light';
      })();
    </script>
